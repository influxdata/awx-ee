---
version: 3
images:
  base_image:
    name: quay.io/centos/centos:stream10
dependencies:
  ansible_core:
    # A minimum of 2.15 is required to get ansible-inventory --limit option
    package_pip: ansible-core==2.21.2
  ansible_runner:
    package_pip: ansible-runner>=2.4.2
  python_interpreter:
    # python3.13 is provided by EPEL (enabled in prepend_base); Stream 10 base repos ship 3.12
    package_system: python3.13
    python_path: "/usr/bin/python3.13"
  galaxy: |
    ---
    collections:
      - name: awx.awx
        version: 24.5.0
      - name: amazon.aws
        version: ">=9.3.0"
      - name: ansible.posix
      - name: ansible.receptor
        version: ">=2.0.8"
      - name: ansible.utils
      - name: community.aws
      - name: community.general
      - name: community.docker
        version: ">=3.10.2"
      - name: community.grafana
  system: |
    git-core [platform:rpm]
    python3.13-devel [platform:rpm compile]
    python3.13-pip [platform:rpm]
    libcurl-devel [platform:rpm compile]
    krb5-devel [platform:rpm compile]
    krb5-workstation [platform:rpm]
    subversion [platform:rpm]
    subversion [platform:dpkg]
    git-lfs [platform:rpm]
    sshpass [platform:rpm]
    rsync [platform:rpm]
    epel-release [platform:rpm]
    python-unversioned-command [platform:rpm]
    unzip [platform:rpm]
    jq [platform:rpm]
    vim [platform:rpm]
    openssl [platform:rpm]
    podman-remote [platform:rpm]
    cmake [platform:rpm compile]
    gcc [platform:rpm compile]
    gcc-c++ [platform:rpm compile]
    make [platform:rpm compile]
    openssl-devel [platform:rpm compile]
  python: |
    git+https://github.com/ansible/ansible-sign
    ncclient
    paramiko
    pykerberos
    pyOpenSSL>=23.0.0
    pypsrp[kerberos,credssp]
    pywinrm[kerberos,credssp]
    toml
    pexpect>=4.5
    python-daemon
    pyyaml
    six
    cryptography>=39.0.0
    redis
    boto3[crt]
    receptorctl
    netaddr
    ara
    mitogen
additional_build_steps:
  prepend_base:
    # Stream 10 base repos cap at python3.12; python3.13 comes from EPEL, which
    # requires the CRB repo enabled first. This runs at the start of the base stage
    # so the interpreter + pip + devel are present before ansible-builder's setup and
    # are inherited by the galaxy/builder/final stages.
    - RUN dnf install -y dnf-plugins-core
    - RUN dnf config-manager --set-enabled crb
    - RUN dnf install -y epel-release
    - RUN dnf install -y python3.13 python3.13-pip python3.13-devel
  append_base:
    - RUN $PYCMD -m pip install -U pip
    # Register under /usr/local/bin, which precedes /usr/bin on PATH and holds no
    # rpm-owned files. /usr/bin/python is owned by python-unversioned-command, so a
    # dnf update there silently reverts the link; /usr/bin/python3 must stay on the
    # platform interpreter because dnf4 runs '#!/usr/bin/python3 -s' against bindings
    # that only exist under python3.12.
    - RUN alternatives --install /usr/local/bin/python python /usr/bin/python3.13 313
    - RUN alternatives --install /usr/local/bin/python3 python3 /usr/bin/python3.13 313
  append_final:
    - COPY --from=quay.io/ansible/receptor:v1.6.6 /usr/bin/receptor /usr/bin/receptor
    - RUN mkdir -p /var/run/receptor
    - RUN git lfs install --system
